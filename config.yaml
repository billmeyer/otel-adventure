# EXTENSIONS #################################################
extensions:
  datadog:
    api:
      site: ${DD_SITE_PARAMETER}
      key: ${DD_API_KEY}
    http:
      endpoint: "localhost:9875"
      path: "/metadata"

# CONNECTORS #################################################
connectors:
  datadog/connector:
    traces:
      span_name_as_resource_name: true

# RECEIVERS ##################################################
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"
  prometheus:
    config:
      scrape_configs:
      - job_name: opentelemetry-collector
        scrape_interval: 10s
        static_configs:
        - targets:
          - 127.0.0.1:8888

# PROCESSORS #################################################
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64

  batch:
    timeout: 2s

  resource:
    attributes:
      - key: deployment.environment
        value: "otel-adventure"
        action: upsert

  resourcedetection:
    detectors:
      - env
      - system
      #- docker
    system:
      hostname_sources:
        - os

  # https://docs.datadoghq.com/opentelemetry/guide/otlp_delta_temporality/#converting-to-delta-temporality-on-the-collector
  cumulativetodelta:

exporters:
  debug/basic:
    verbosity: basic

  debug/detailed:
    verbosity: detailed

  datadog:
    api:
      site: ${DD_SITE}
      key: ${DD_API_KEY}
    hostname: testlab

# SERVICE ####################################################
service:
  extensions:
    - datadog

  telemetry:
    # Enable health monitoring of the Collector instance
    metrics:
#      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: "localhost"
                port: 8888      
    logs:
      level: info

  pipelines:
    metrics:
      receivers:
        - otlp
        - prometheus
        - datadog/connector

      processors:
        - memory_limiter
        - resource
        - resourcedetection
        - batch

      exporters:
        - debug/basic
        - datadog

    traces:
      receivers:
        - otlp

      processors:
        - memory_limiter
        - resource
        - resourcedetection
        - batch

      exporters:
        - debug/detailed
        - datadog/connector
        - datadog

    logs:
      receivers:
        - otlp

      processors:
        - memory_limiter
        - resource
        - resourcedetection
        - batch

      exporters:
        - debug/basic
        - datadog
